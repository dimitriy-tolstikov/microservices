name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Microservices.slnx

    - name: Build solution
      run: dotnet build Microservices.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Microservices.slnx --configuration Release --no-build --verbosity normal
